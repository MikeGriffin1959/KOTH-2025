# =====================================================================
# KOTH — prod profile (AWS Elastic Beanstalk).
# Activated by SPRING_PROFILES_ACTIVE=prod (set as an EB env property).
# The datasource points at the shared golf-prod RDS; the actual URL/user/
# password are injected as EB environment properties (SPRING_DATASOURCE_*)
# from .secrets/eb-options.json so no DB credentials live in source/git.
# The Anthropic key arrives via the COMMENTARY_API_KEY env property, which
# the base application.properties already binds to commentary.api.key.
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
