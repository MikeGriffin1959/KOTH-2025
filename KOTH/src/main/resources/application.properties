# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/koth
spring.datasource.username=root
spring.datasource.password=Mike1959
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# View resolver configuration
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# Enable this for local debugging
#logging.level.org.springframework=DEBUG
#logging.level.com.zaxxer.hikari=DEBUG

server.servlet.context-path=/KOTH

# ── AI Commentary (Anthropic) ─────────────────────────────────────────────
# The real API key must NOT be committed. It is supplied by the gitignored
# secrets file imported below (C:\KOTH-secrets\secrets.properties in prod/dev,
# or a local ./secrets.properties), which overrides the placeholder here.
commentary.api.key=${COMMENTARY_API_KEY:placeholder}
commentary.api.model=claude-sonnet-4-6
commentary.api.dailyCapUsd=5.00
commentary.scheduler.tickMs=60000

# ── Twilio SMS (ported from GolferFest — same account/number/Verify service) ──
# Real values come from the gitignored secrets file (dev) or TWILIO_* EB
# environment properties (prod). 'placeholder' disables SMS gracefully.
twilio.account.sid=${TWILIO_ACCOUNT_SID:placeholder}
twilio.auth.token=${TWILIO_AUTH_TOKEN:placeholder}
twilio.phone.number=${TWILIO_PHONE_NUMBER:placeholder}
twilio.verify.service.sid=${TWILIO_VERIFY_SERVICE_SID:placeholder}

# Base URL used to build emailed verification links (includes /KOTH context).
# Prod sets APP_BASE_URL=https://koth.bingmerfest.com/KOTH as an EB env property.
app.base.url=${APP_BASE_URL:http://localhost:8081/KOTH}

# Load secret overrides if present. 'optional:' => app still starts if absent.
# Absolute path matches the existing prod additional-location and is working-
# directory independent (important for the Eclipse dev launch). The ./ entry is
# a convenience fallback for a repo-local, gitignored secrets file.
spring.config.import=optional:file:C:/KOTH-secrets/secrets.properties,optional:file:./secrets.properties

